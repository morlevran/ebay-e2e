[pytest]
testpaths = tests
addopts =
    --alluredir=reports/allure-results
    --clean-alluredir
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
    --tracing=on
    --output=reports/traces
    --screenshot=only-on-failure
log_cli = true
log_cli_level = INFO
markers =
    e2e: end-to-end scenario against the live site
    unit: offline unit tests
